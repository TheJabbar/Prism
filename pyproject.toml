[project]
name = "prism-terminal"
version = "1.0.0"
description = "Indonesian Financial Intelligence Terminal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "groq>=0.8.0",
    "APScheduler>=3.10.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "scrapling[fetchers]>=0.2.0",
    "yfinance>=0.2.42",
    "python-dateutil>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
